# Secret scan with the gitleaks CLI (not gitleaks-action, which needs a license for orgs).
#
# HOW TO UNBLOCK a failing run:
#   1. Triage the finding (redacted in the log): is it a real secret or a false positive?
#   2. Real secret: rotate/revoke it first, then remove it from the history.
#   3. False positive: add its fingerprint to .gitleaksignore in a PR.
#      Only Eberson approves .gitleaksignore entries.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (sha256 verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --exit-code 1 -v
