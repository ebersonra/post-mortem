# Validates GitHub Pages build, including a published article copied from tests/fixtures.
# The fixture is not part of the live site (Pages builds the repo without this step).
name: jekyll-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Stage CI article fixture
        run: |
          mkdir -p _articles
          cp tests/fixtures/articles/ci-published-article.md "_articles/ci-published-article.md"
      - name: Assert every post-mortem has a date
        run: |
          set -euo pipefail
          missing=""
          for f in postmortems/*.md; do
            case "$f" in */index.md) continue ;; esac
            # Only the front matter (between the first two '---' lines) counts.
            if ! awk 'NR==1 && $0!="---"{exit 1} NR>1 && $0=="---"{exit found?0:1} NR>1 && /^date:[[:space:]]*[^[:space:]]/{found=1} END{if(!found) exit 1}' "$f"; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then echo "Post-mortems sem date no front matter:$missing"; exit 1; fi
      - name: Build site
        run: bundle exec jekyll build
      - name: Assert article output and mixed listing
        run: |
          set -euo pipefail
          test -f _site/artigos/ci-published-article.html
          test ! -e _site/tests
          grep -q 'post-card__type">Artigo' _site/index.html
          # Mixed listing is asserted on the 2026-10 archive (unbounded list); the home only shows the 8 latest.
          month=_site/archive/2026/10/index.html
          grep -q 'post-card__type">Artigo' "$month"
          grep -q 'post-card__type">Post-mortem' "$month"
          artigo_line="$(grep -n 'post-card__type">Artigo' "$month" | head -1 | cut -d: -f1)"
          pm_line="$(grep -n 'post-card__type">Post-mortem' "$month" | head -1 | cut -d: -f1)"
          test -n "$artigo_line" && test -n "$pm_line"
          test "$artigo_line" -lt "$pm_line"
      - name: Assert home always lists a post-mortem (#20)
        run: |
          set -euo pipefail
          grep -q 'post-card__type">Post-mortem' _site/index.html
      - name: Simulate home with controlled fixtures (#20)
        run: tests/home-sim.sh
      - name: Cleanup simulation fixtures
        if: always()
        run: rm -f _articles/ci-flood-*.md postmortems/ci-pm-*.md
