<nav class="site-nav" aria-label="Principal">
  <a class="site-nav__brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <button type="button" class="site-nav__menu-toggle" aria-expanded="false" aria-controls="site-nav-links" data-nav-toggle>
    <span class="visually-hidden">Abrir menu</span>
    <span aria-hidden="true">☰</span>
  </button>
  <div class="site-nav__links" id="site-nav-links">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Início</a>
    <a href="{{ '/postmortems/' | relative_url }}"{% if page.url contains '/postmortems/' and page.layout != 'postmortem' %} aria-current="page"{% endif %}>Post-mortems</a>
    <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projetos</a>
    <a href="{{ '/archive/' | relative_url }}"{% if page.url contains '/archive/' %} aria-current="page"{% endif %}>Arquivo</a>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Alternar tema claro/escuro">
      <span class="theme-toggle__icon" aria-hidden="true">◐</span>
      <span class="theme-toggle__label">Tema</span>
    </button>
  </div>
</nav>
