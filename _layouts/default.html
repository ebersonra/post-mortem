<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description }}">
  {% seo %}
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  {% include head-custom.html %}
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="site-header">
    {% include site-nav.html %}
  </header>
  <main id="main-content" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Post-mortems blameless — versões públicas e sanitizadas.</p>
    <p class="site-footer__meta">Publicado via GitHub Pages · Tema base <code>jekyll-theme-minimal</code></p>
  </footer>
</body>
</html>
