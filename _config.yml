title: Tech Blog Bargainly
description: Post-mortems blameless públicos (versões sanitizadas) — Tech Blog Bargainly
theme: jekyll-theme-minimal
lang: pt-BR
markdown: kramdown
kramdown:
  input: GFM
url: "https://tech.bargainly.com.br"
baseurl: ""
plugins:
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      image:
        path: /assets/images/og/default.png
        alt: Tech Blog Bargainly — post-mortems blameless, edição digital
        width: 1200
        height: 630
      twitter:
        card: summary_large_image
  - scope:
      path: "postmortems"
      type: "pages"
    values:
      layout: postmortem
      type: postmortem
      twitter:
        card: summary_large_image
